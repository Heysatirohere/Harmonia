# Integração contínua do HarmonIA (RNF04, RNF05): testes e cobertura mínima em todo push e PR.
# Cobertura mínima: 80% no app (RNF05) e 90% no backend (hoje em 93%; não deixar cair).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Mesma versão da imagem de produção (backend/Dockerfile)
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest-cov
      - name: Testes com cobertura
        run: python -m pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=90

  app:
    name: App (flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Análise estática
        run: flutter analyze
      - name: Testes com cobertura
        run: flutter test --coverage
      - name: Cobertura mínima de 80% (RNF05)
        run: |
          awk -F: '/^LF:/ {lf += $2} /^LH:/ {lh += $2} END {
            pct = 100 * lh / lf
            printf "Cobertura do app: %.1f%% (%d de %d linhas)\n", pct, lh, lf
            if (pct < 80) { print "Abaixo de 80% (RNF05)"; exit 1 }
          }' coverage/lcov.info
