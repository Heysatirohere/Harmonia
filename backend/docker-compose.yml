version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: harmonia_db
    restart: always
    environment:
      POSTGRES_DB: harmonia_db
      POSTGRES_USER: harmonia_user
      POSTGRES_PASSWORD: harmonia_secret
    ports:
      - "5432:5432"
    volumes:
      - ./init_db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harmonia_user -d harmonia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
